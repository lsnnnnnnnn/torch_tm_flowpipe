run_attack: false
num_vars: 6
num_nn_input: 4
num_nn_output: 1
steps: 1
step_size: 0.02
ode_step_size: 0.005
ode_order: 3
cut_off_threshold: 1.0e-06
remainder_estimation:
- -0.1
- 0.1
initial_set:
- name: x1
  interval:
  - -0.1
  - 0.1
- name: x2
  interval:
  - -0.05
  - 0.05
- name: x3
  interval:
  - -0.1
  - 0.1
- name: x4
  interval:
  - -0.05
  - 0.05
- name: t
  interval:
  - 0
  - 0
- name: u1
  interval:
  - 0
  - 0
dynamics_expressions:
- x2
- 2 * u1
- x4
- (0.08*0.41*(9.8 * sin(x3) - 2*u1 * cos(x3)) - 0.0021 * x4) / 0.0105
- '1'
- '0'
model_dir: /srv/local/shengenli/CROWN-Reach/ARCH-COMP2024/benchmarks/CartPole/model.onnx
input_shape:
- -1
- 4
output_T_shape:
- -1
- 1
- 4
output_c_shape:
- -1
- 1
output_scale: 1
output_offset: 0
bound_opts:
  activation_bound_option: same-slope
  conv_mode: matrix
sr_queue: 1000
controller_dtype: float32
split_vars: []
