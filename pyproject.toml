[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tm-flowpipe"
version = "0.1.0"
description = "Minimal PyTorch-native Taylor model flowpipe prototype for polynomial NNCS plant dynamics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "PyYAML", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "pandas", "mpmath"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "unit: fast isolated unit tests",
    "property: invariant and property-style tests",
    "regression: regression tests for confirmed historical defects",
    "integration: multi-module or subprocess integration tests",
    "protocol: experiment schema, eligibility, timing, and reporting contracts",
    "flowstar: requires the pinned external Flowstar checkout and build",
    "diffreach: requires the pinned external DiffReach checkout and JAX environment",
    "cuda: requires an NVIDIA CUDA device",
    "slow: intentionally long-running checks",
    "formal_run: validates a frozen formal experiment artifact",
    "external_integration: requires explicitly supplied, non-repository external sources or assets",
]

[tool.setuptools.packages.find]
where = ["src"]
