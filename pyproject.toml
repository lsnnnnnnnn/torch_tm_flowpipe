[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-tm-flowpipe"
version = "0.1.0"
description = "PyTorch Taylor models and validated flowpipes for polynomial plant dynamics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest", "matplotlib"]
plot = ["matplotlib"]
method = ["numpy", "mpmath", "PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torch_tm_flowpipe = ["*.cu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: isolated numerical unit tests",
    "property: numerical invariants",
    "regression: regression tests for numerical behavior",
    "integration: multi-module numerical tests",
    "cuda: requires an NVIDIA CUDA device",
    "slow: longer running numerical tests",
]
