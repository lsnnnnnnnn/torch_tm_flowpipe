contract:
  canonical_system_spec:
    initial_box:
    - - 1.1
      - 1.4
    - - 2.35
      - 2.45
    rhs:
    - terms:
      - coefficient: 1.0
        powers:
        - 0
        - 1
    - terms:
      - coefficient: 1.0
        powers:
        - 0
        - 1
      - coefficient: -1.0
        powers:
        - 1
        - 0
      - coefficient: -1.0
        powers:
        - 2
        - 1
    state_names:
    - position
    - velocity
  cutoff: 1.0e-10
  dtype: float64
  h_max: 0.1
  h_min: 0.002
  initial_box:
  - - 1.1
    - 1.4
  - - 2.35
    - 2.45
  ode:
  - y
  - (1 - x^2) * y - x
  output_contract:
    collapsed_endpoint: diagnostic_only
    fallback_between_fields: forbidden
    full_tube: required
    last_segment: required
    raw_endpoint: required
    repaired_hull: diagnostic_only
    tightened_endpoint: independent_optional_field
  requested_order: 4
  reset_mode: normalized_insertion
  source_files:
  - benchmarks/canonical.yaml
  - benchmarks/three_tool_matched_contract.yaml
  step_policy_mode: flowstar_compat
  target_horizon: 10.0
  target_remainder_radius: 0.0001
  validation_mode: flowstar_raw_remainder_compat
device: cpu
diagnostic_factors:
- right_map_center_mode=range_midpoint
requested_horizon: 10.0
reset_mode: normalized_insertion
right_map_center_mode: range_midpoint
right_map_range_mode: standard
single_factor_diagnostic: true
tm_backend: dense
