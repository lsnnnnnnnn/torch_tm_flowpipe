contract:
  canonical_system_spec:
    initial_box:
    - - 1.1
      - 1.4
    - - 2.35
      - 2.45
    rhs:
    - terms:
      - coefficient: 1.0
        powers:
        - 0
        - 1
    - terms:
      - coefficient: 1.0
        powers:
        - 0
        - 1
      - coefficient: -1.0
        powers:
        - 1
        - 0
      - coefficient: -1.0
        powers:
        - 2
        - 1
    state_names:
    - position
    - velocity
  cutoff: 1.0e-10
  dtype: float64
  h_max: 0.1
  h_min: 0.002
  initial_box:
  - - 1.1
    - 1.4
  - - 2.35
    - 2.45
  initial_box_exact_decimal:
  - - '1.1'
    - '1.4'
  - - '2.35'
    - '2.45'
  initialization_contract: exact_decimal_contract
  ode:
  - y
  - (1 - x^2) * y - x
  output_contract:
    collapsed_endpoint: diagnostic_only
    fallback_between_fields: forbidden
    full_tube: required
    last_segment: required
    raw_endpoint: required
    repaired_hull: diagnostic_only
    tightened_endpoint: independent_optional_field
  requested_order: 4
  reset_mode: normalized_insertion
  source_files:
  - benchmarks/canonical.yaml
  - benchmarks/three_tool_matched_contract.yaml
  step_policy_mode: flowstar_compat
  target_horizon: 10.0
  target_remainder_radius: 0.0001
  validation_mode: flowstar_raw_remainder_compat_factorized_joint
dense_range_contexts:
- polynomial_truncation
dense_range_max_depth: 1
dense_range_max_leaves: 4
dense_range_method: adaptive_subdivision
dense_range_split_vars:
- 0
- 1
dense_range_trigger: proactive_depth1_on_named_contexts
dense_range_variable_orders:
- - 0
  - 1
  - 2
- - 1
  - 0
  - 2
- - 2
  - 0
  - 1
device: cuda
diagnostic_factors:
- reset_mode=normalized_insertion_dependency_preserving
- validation_mode=flowstar_raw_remainder_compat_factorized_joint
fixed_step: 0.01
initialization_contract: exact_decimal_contract
requested_horizon: 0.1
reset_mode: normalized_insertion_dependency_preserving
right_map_center_mode: constant
right_map_range_mode: standard
save_terminal_checkpoint: true
single_factor_diagnostic: false
tm_backend: dense
trace_flush_every: 0
validation_mode: flowstar_raw_remainder_compat_factorized_joint
