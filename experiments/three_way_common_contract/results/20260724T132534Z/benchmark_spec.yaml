schema_version: 1
name: three_way_common_contract
title: Three-way low-order reachability comparison under common external contracts
random_seed: 20260724
steady_repetitions: 5
timeout_s: 600
numerical_containment_tolerance: 1.0e-9
trajectory_tolerance: 2.0e-8
trajectory_substeps_per_segment: 4

tool_paths:
  torch: /srv/local/shengenli/torch_tm_flowpipe_three_way_comparison
  diffreach: /srv/local/shengenli/DiffReach
  flowstar: /srv/local/shengenli/flowstar

torch:
  dtype: float64
  device: cpu
  order: 1
  validation_mode: growth
  max_validation_attempts: 20
  cutoff: null
  symbolic_remainder_size: 0

diffreach:
  dtype: float64
  device: cpu
  init_remainder: 0.1
  frr_rounds: 5
  frr_stop_ratio: 0.95
  symbolic_remainder_window: 100
  bound_time_step: false

flowstar:
  local_order: 2
  fixed_step: true
  fixed_order: true
  remainder_estimation:
    riccati: 1.0e-4
    harmonic: 1.0e-4
    van_der_pol: 1.0e-3
  cutoff: 1.0e-15
  symbolic_remainder_size: 0
  preconditioning: toolbox_normalized_QR
  extraction_workaround: validated_initial_picard_candidate_remainder_restored_before_extraction

protocols:
  one_step_common_input:
    riccati:
      step_sizes: [0.005, 0.01, 0.02, 0.05]
      smoke_h: 0.01
    harmonic:
      step_sizes: [0.005, 0.01, 0.02, 0.05]
      smoke_h: 0.01
    van_der_pol:
      step_sizes: [0.0025, 0.005, 0.01, 0.02]
      smoke_h: 0.005
  multi_step_common_box_carry:
    riccati:
      configurations:
        - {h: 0.01, horizon: 1.0}
      smoke: {h: 0.01, horizon: 0.02}
    harmonic:
      configurations:
        - {h: 0.01, horizon: 4.0}
      smoke: {h: 0.01, horizon: 0.02}
    van_der_pol:
      configurations:
        - {h: 0.005, horizon: 1.0}
        - {h: 0.01, horizon: 1.0}
      smoke: {h: 0.005, horizon: 0.02}
  native_low_order:
    riccati:
      configurations:
        - {h: 0.01, horizon: 1.0}
      smoke: {h: 0.01, horizon: 0.02}
    harmonic:
      configurations:
        - {h: 0.01, horizon: 4.0}
      smoke: {h: 0.01, horizon: 0.02}
    van_der_pol:
      configurations:
        - {h: 0.005, horizon: 1.0}
        - {h: 0.01, horizon: 1.0}
      smoke: {h: 0.005, horizon: 0.02}

common_time_checkpoints:
  riccati: [0.1, 0.5, 1.0]
  harmonic: [1.0, 2.0, 4.0]
  van_der_pol: [0.02, 0.05, 0.08]

systems:
  riccati:
    title: Scalar Riccati
    state_names: [x]
    initial_box:
      - [0.0, 0.1]
    point_checks:
      - [0.0]
      - [0.05]
      - [0.1]
    rhs:
      - terms:
          - coefficient: 1.0
            powers: [2]
    exact_reference: riccati
  harmonic:
    title: Harmonic oscillator
    state_names: [x1, x2]
    initial_box:
      - [-0.1, 0.1]
      - [-0.1, 0.1]
    point_checks:
      - [0.0, 0.0]
      - [0.1, -0.1]
      - [-0.035, 0.072]
    rhs:
      - terms:
          - coefficient: 1.0
            powers: [0, 1]
      - terms:
          - coefficient: -1.0
            powers: [1, 0]
    exact_reference: harmonic
  van_der_pol:
    title: Van der Pol (mu=1)
    state_names: [x1, x2]
    initial_box:
      - [1.10, 1.40]
      - [2.35, 2.45]
    point_checks:
      - [1.10, 2.35]
      - [1.25, 2.40]
      - [1.40, 2.45]
    rhs:
      - terms:
          - coefficient: 1.0
            powers: [0, 1]
      - terms:
          - coefficient: 1.0
            powers: [0, 1]
          - coefficient: -1.0
            powers: [1, 0]
          - coefficient: -1.0
            powers: [2, 1]
    exact_reference: none
