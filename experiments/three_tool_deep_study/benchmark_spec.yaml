schema_version: 1
name: torch_flowstar_diffreach_deep_study
random_seed: 20260729
containment_tolerance: 1.0e-12
trajectory_tolerance: 2.0e-8
timeout_s: 900

repositories:
  torch: /srv/local/shengenli/torch_tm_flowpipe_three_tool_study
  torch_repaired_base: /srv/local/shengenli/torch_tm_flowpipe_three_way_repair
  diffreach: /srv/local/shengenli/DiffReach
  flowstar_original: /srv/local/shengenli/flowstar
  flowstar_audit: /srv/local/shengenli/flowstar_three_way_audit

environments:
  torch: py11
  diffreach: diffreach312
  flowstar: system-gcc-mpfr

frozen_inputs:
  - experiments/three_way_common_contract/results/20260724T132534Z
  - experiments/three_way_comparison_repair/results/20260728T140456Z

systems:
  riccati:
    state_names: [x]
    initial_box: [[0.0, 0.1]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [2]}
  harmonic:
    state_names: [x1, x2]
    initial_box: [[-0.1, 0.1], [-0.1, 0.1]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
      - terms:
          - {coefficient: -1.0, powers: [1, 0]}
  coupled_quadratic:
    state_names: [x1, x2]
    initial_box: [[0.08, 0.12], [0.18, 0.22]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [1, 1]}
      - terms:
          - {coefficient: 1.0, powers: [2, 0]}
          - {coefficient: -1.0, powers: [0, 1]}
  van_der_pol:
    state_names: [x1, x2]
    initial_box: [[1.10, 1.40], [2.35, 2.45]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
          - {coefficient: -1.0, powers: [1, 0]}
          - {coefficient: -1.0, powers: [2, 1]}

one_step:
  riccati: [0.005, 0.01, 0.02, 0.05]
  harmonic: [0.005, 0.01, 0.02, 0.05]
  coupled_quadratic: [0.0025, 0.005, 0.01, 0.02]
  van_der_pol: [0.0025, 0.005, 0.01, 0.02]

multi_step:
  riccati:
    - {h: 0.01, horizon: 1.0}
  harmonic:
    - {h: 0.01, horizon: 4.0}
  coupled_quadratic:
    - {h: 0.005, horizon: 0.25}
    - {h: 0.01, horizon: 0.25}
  van_der_pol:
    - {h: 0.005, horizon: 1.0}
    - {h: 0.01, horizon: 1.0}

smoke:
  riccati: {h: 0.01, horizon: 0.03}
  harmonic: {h: 0.01, horizon: 0.03}
  coupled_quadratic: {h: 0.005, horizon: 0.015}
  van_der_pol: {h: 0.005, horizon: 0.015}

torch:
  orders: [1, 2, 4, 6]
  validation_mode: growth
  max_validation_attempts: 20
  cutoff: null
  dtype: float64
  device: cpu
  reset_modes: [dependency_preserving, range_only, affine_reset, qr_reset]

diffreach:
  init_remainder: 0.1
  frr_rounds: [1, 3, 5]
  frr_stop_ratio: 0.95
  symbolic_windows: [1, 10, 100]
  dtype: float64
  device: cpu

flowstar:
  primary_variant: flowstar_root_cause_patch
  audit_variants:
    - flowstar_stock
    - flowstar_full_picard_revalidated
    - flowstar_root_cause_patch
  orders: [2, 3, 4, 6]
  cutoff: 1.0e-15
  candidate_remainder:
    riccati: 1.0e-3
    harmonic: 1.0e-3
    coupled_quadratic: 1.0e-4
    van_der_pol: 1.0e-3
  original_vanderpol:
    horizon: 10.0
    order: 4
    cutoff: 1.0e-10
    candidate_remainder: 1.0e-4
    symbolic_remainder_window: 100
    preconditioning: QR

matched_bases:
  B1: [constant, tau, affine_state]
  B_DR: [constant, tau, affine_state, tau_squared, tau_state]
  B2: [complete_total_degree_2]
  B3: [complete_total_degree_3]

runtime:
  repetitions: 10
  batch_size: 1
  primary_device: cpu
