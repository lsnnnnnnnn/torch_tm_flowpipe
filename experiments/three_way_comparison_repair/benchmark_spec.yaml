schema_version: 2
name: three_way_comparison_correctness_repair
random_seed: 20260728
containment_tolerance: 1.0e-12
trajectory_tolerance: 2.0e-8
timeout_s: 600

repositories:
  torch: .
  diffreach: ../DiffReach
  flowstar_original: ../flowstar
  flowstar_audit: ../flowstar-audit

frozen_result: experiments/three_way_common_contract/results/20260724T132534Z

torch:
  order: 1
  validation_mode: growth
  max_validation_attempts: 20
  cutoff: null
  dtype: float64
  device: cpu

diffreach:
  init_remainder: 0.1
  frr_rounds: 5
  frr_stop_ratio: 0.95
  symbolic_remainder_window: 100
  dtype: float64
  device: cpu

flowstar:
  stock_order: 2
  cutoff: 1.0e-15
  candidate_remainder:
    riccati: 1.0e-4
    harmonic: 1.0e-4
    van_der_pol: 1.0e-3
  sensitivity:
    orders: [2, 3, 4, 5, 6]
    step_sizes: [0.005, 0.01, 0.02, 0.05]
    candidate_remainders: [1.0e-8, 1.0e-7, 1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2]
    cutoffs: [0.0, 1.0e-16, 1.0e-15, 1.0e-12, 1.0e-10]
  original_vanderpol:
    horizon: 10.0
    step_policy: adaptive_0.002_to_0.1
    order: 4
    cutoff: 1.0e-10
    candidate_remainder: 1.0e-4
    symbolic_remainder_window: 100
    preconditioning: QR

benchmarks:
  riccati:
    one_step_h: [0.005, 0.01, 0.02, 0.05]
    multi_step:
      - {h: 0.01, horizon: 1.0}
    smoke: {h: 0.01, horizon: 0.01}
  harmonic:
    one_step_h: [0.005, 0.01, 0.02, 0.05]
    multi_step:
      - {h: 0.01, horizon: 4.0}
    smoke: {h: 0.01, horizon: 0.01}
  van_der_pol:
    one_step_h: [0.0025, 0.005, 0.01, 0.02]
    multi_step:
      - {h: 0.005, horizon: 1.0}
      - {h: 0.01, horizon: 1.0}
    smoke: {h: 0.005, horizon: 0.005}

systems:
  riccati:
    state_names: [x]
    initial_box: [[0.0, 0.1]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [2]}
  harmonic:
    state_names: [x1, x2]
    initial_box: [[-0.1, 0.1], [-0.1, 0.1]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
      - terms:
          - {coefficient: -1.0, powers: [1, 0]}
  van_der_pol:
    state_names: [x1, x2]
    initial_box: [[1.10, 1.40], [2.35, 2.45]]
    rhs:
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
      - terms:
          - {coefficient: 1.0, powers: [0, 1]}
          - {coefficient: -1.0, powers: [1, 0]}
          - {coefficient: -1.0, powers: [2, 1]}
